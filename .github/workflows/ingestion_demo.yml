
name: VeloToulouse - Ingestion IaC Demo

on:
  workflow_dispatch:

  schedule:
    # 07:17 UTC = 08:17 en hiver en France
    - cron: "17 7 * * *"

permissions:
  contents: read

concurrency:
  group: velotoulouse-ingestion-demo
  cancel-in-progress: false

jobs:
  ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          python -m pip install \
            "requests>=2.31,<3" \
            "python-dotenv>=1,<2" \
            "azure-eventhub>=5.12,<6" \
            "websocket-client>=1.8,<2"

            
      - name: Diagnostiquer l'API Toulouse
        run: |
          python - <<'PY'
          import requests

          url = (
              "https://data.toulouse-metropole.fr/api/explore/v2.1/"
              "catalog/datasets/"
              "velotoulouse-disponibilite-temps-reel/records"
          )

          response = requests.get(
              url,
              params={"limit": 1, "offset": 0},
              timeout=30,
          )

          print("HTTP status:", response.status_code)
          print("Content-Type:", response.headers.get("Content-Type"))

          try:
              data = response.json()
              print("total_count:", data.get("total_count"))
              print("results count:", len(data.get("results", [])))
              print("response keys:", list(data.keys()))
          except Exception as exc:
              print("JSON decoding error:", type(exc).__name__)

          PY


      - name: Executer une ingestion complete
        env:
          EVENTHUB_CONNECTION_STRING: ${{ secrets.FABRIC_EVENTHUB_CONNECTION_STRING_DEMO }}
          INGESTION_MAX_STATIONS: "0"
        run: python terraform/test_ingestion_once.py
